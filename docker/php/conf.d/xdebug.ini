; --- Xdebug (opt-in) ---
; Enabled but idle by default: no performance hit until a debug session is
; triggered (XDEBUG_SESSION cookie / ?XDEBUG_SESSION_START, or debug trigger).
; Switch `xdebug.mode` to `off` in docker-compose env to disable entirely.
xdebug.mode = debug,develop
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
